# Empêche la mise en veille du projet Supabase gratuit (pause après 7 jours sans activité).
# Ajoutez SUPABASE_URL et SUPABASE_ANON_KEY dans Settings > Secrets and variables > Actions.
name: Supabase keep-alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Réponse HTTP : $status"
          test "$status" = "200"
