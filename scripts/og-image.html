<!doctype html>
<!--
  Image d'aperçu des liens (WhatsApp, Facebook, iMessage…) : 1200 × 630.
  Pour la régénérer après un changement de prénoms, de date ou de couleurs :
    1. modifiez les textes ci-dessous ;
    2. ouvrez ce fichier dans Chrome, ou lancez (macOS) :
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og.png scripts/og-image.html
       sips -s format jpeg -s formatOptions 82 og.png --out public/og-image.jpg
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#121A33; --marine:#1E2A50; --gold:#A88B60; --sand:#D9C9A9; --ivory:#F4F2EE; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(1.5px 1.5px at 80px 90px, var(--gold), transparent),
      radial-gradient(1px 1px at 230px 400px, var(--sand), transparent),
      radial-gradient(2px 2px at 1080px 120px, var(--gold), transparent),
      radial-gradient(1px 1px at 980px 520px, var(--ivory), transparent),
      radial-gradient(1.5px 1.5px at 150px 560px, var(--gold), transparent),
      radial-gradient(1px 1px at 1130px 330px, var(--sand), transparent),
      radial-gradient(ellipse at 50% 40%, var(--marine), var(--navy) 70%);
    color: var(--ivory); font-family: 'Jost', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .frame { position: absolute; inset: 26px; border: 2px solid var(--gold); }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); }
  .wrap { display: flex; align-items: center; gap: 70px; position: relative; }
  /* Enveloppe */
  .env { width: 360px; height: 250px; position: relative; border-radius: 6px; background: color-mix(in srgb, var(--navy) 75%, #000);
    box-shadow: 0 30px 50px -20px rgba(0,0,0,.7); transform: rotate(-4deg); }
  .pocket { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(160deg, #ffffff10, transparent 40%), var(--ivory);
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); }
  .flap { position: absolute; inset: 0 0 auto; height: 52%; filter: drop-shadow(0 4px 5px rgba(0,0,0,.25)); }
  .flap div { position: absolute; inset: 0; background: color-mix(in srgb, var(--sand) 70%, var(--ivory)); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .seal { position: absolute; left: 50%; top: 52%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--gold) 60%, #fff 40%), var(--gold) 45%, color-mix(in srgb, var(--gold) 70%, #000 30%));
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 35%, transparent), inset 0 -5px 12px rgba(0,0,0,.25), 0 10px 20px rgba(0,0,0,.35);
    display: grid; place-items: center; font-family: 'Bodoni Moda', serif; font-weight: 600; font-size: 28px; color: var(--navy); }
  .seal::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--navy) 45%, transparent); }
  /* Texte */
  .txt { text-align: center; width: 560px; }
  .kicker { letter-spacing: .32em; text-transform: uppercase; font-size: 20px; color: var(--sand); }
  .names { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 92px; line-height: 1.05; margin: 18px 0 10px; }
  .names i { color: var(--gold); font-weight: 400; font-size: 60px; padding: 0 .12em; }
  .rule { width: 120px; height: 2px; background: var(--gold); margin: 22px auto; }
  .date { font-family: 'Bodoni Moda', serif; font-size: 34px; }
  .place { margin-top: 8px; font-size: 22px; color: var(--sand); letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="env"><div class="pocket"></div><div class="flap"><div></div></div><div class="seal">F&amp;R</div></div>
    <div class="txt">
      <p class="kicker">Invitation au mariage</p>
      <h1 class="names">Fredoly<i>&amp;</i>Rose</h1>
      <div class="rule"></div>
      <p class="date">Samedi 13 février 2027</p>
      <p class="place">Douala · Cameroun</p>
    </div>
  </div>
</body>
</html>
